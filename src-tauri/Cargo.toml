[package]
name = "baka-trans"
version = "0.2.0"
description = "Real-time meeting translation for macOS and Windows"
authors = ["baka-trans"]
edition = "2021"

[lib]
name = "baka_trans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
base64 = "0.22"
cpal = "0.15"
futures-util = "0.3"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.0", features = ["macos-private-api"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
whisper-rs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
whisper-rs = { version = "0.16", features = ["metal"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGDirectDisplay", "CGGeometry", "CGImage", "CGWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-vision = { version = "0.3.2", features = ["VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-graphics"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Foundation",
  "Graphics_Imaging",
  "Media_Core",
  "Media_Ocr",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.2"

[dev-dependencies]
tauri = { version = "2.8.0", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
