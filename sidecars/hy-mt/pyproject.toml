[project]
name = "baka-trans-hy-mt-sidecar"
version = "0.1.0"
description = "Managed, offline-only HY-MT translation sidecar"
requires-python = "==3.12.*"
dependencies = [
  "huggingface-hub==1.5.0",
  "psutil==7.0.0",
  "safetensors==0.6.2",
  "torch==2.12.0",
  "transformers==5.6.0",
]

[tool.uv]
package = false

[dependency-groups]
build = [
  "pyinstaller==6.18.0",
]
test = [
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
